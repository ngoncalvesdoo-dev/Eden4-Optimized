name: Build Eden4 PS4 Slim & Base PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eden4 repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenOrbis & Build Dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang lld llvm \
            git curl wget unzip tar pkg-config \
            nasm yasm autoconf automake libtool \
            libudev-dev glslang-tools spirv-tools

          mkdir -p toolchain_dl
          gh release download v0.5.3 -R OpenOrbis/OpenOrbis-PS4-Toolchain -D toolchain_dl
          sudo mkdir -p /opt/OpenOrbis
          FILE=$(ls toolchain_dl/* | head -n 1)
          if [[ "$FILE" == *.zip ]]; then
            sudo unzip -q "$FILE" -d /opt/OpenOrbis
          else
            sudo tar -xzf "$FILE" -C /opt/OpenOrbis
          fi
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis" >> $GITHUB_ENV

      - name: Setup Orbis-Ports & Compile Eden4 for PS4 Slim/Base
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis
          
          # Clona ou usa o orbis-ports que contem o ps4_link_mesa
          if [ ! -d "/opt/orbis-ports" ]; then
            sudo git clone --depth 1 https://github.com /opt/orbis-ports || true
          fi
          export ORBIS_PORTS=/opt/orbis-ports

          cd eden
          mkdir -p build && cd build
          
          TOOLCHAIN_PATH=$(find /opt/orbis-ports /opt/OpenOrbis .. -iname "*ps4*.cmake" -o -iname "*orbis*.cmake" | head -n 1)
          echo "Using PS4 Toolchain CMake: $TOOLCHAIN_PATH"

          cmake .. -G Ninja \
            ${TOOLCHAIN_PATH:+-DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH"} \
            -DCMAKE_MODULE_PATH="/opt/orbis-ports/cmake;/opt/orbis-ports" \
            -DPS4=ON \
            -DYUZU_PS4=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=btver2 -mtune=btver2 -ffast-math -DBOOST_ASIO_DISABLE_KQUEUE" \
            -DCMAKE_CXX_FLAGS="-O3 -march=btver2 -mtune=btver2 -ffast-math -DBOOST_ASIO_DISABLE_KQUEUE" \
            -DYUZU_ENABLE_LTO=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DYUZU_USE_EXTERNAL_VULKAN_HEADERS=ON \
            -DYUZU_USE_EXTERNAL_VULKAN_UTILITY_LIBRARIES=ON \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_SDL2=OFF \
            -DYUZU_USE_BUNDLED_SDL2=OFF \
            -DYUZU_USE_BUNDLED_SDL3=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_LIBUSB=OFF \
            -DENABLE_RESHADE=OFF \
            -DENABLE_DEBUG_TOOLS=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DBUILD_TESTING=OFF
          ninja -j$(nproc)

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden4-PS4-Slim-Base-PKG
          path: |
            **/*.pkg
            **/eboot.bin
            **/*.elf
          if-no-files-found: warn
