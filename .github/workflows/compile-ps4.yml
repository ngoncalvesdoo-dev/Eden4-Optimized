name: Build Eden4 PS4 Slim & Base PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eden4 repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check PS4 CMake setup in repo
        run: |
          echo "=== Conteudo de eden/src/yuzu_ps4/CMakeLists.txt ==="
          cat eden/src/yuzu_ps4/CMakeLists.txt
          echo "=== Arquivos na raiz e em eden/CMakeModules ==="
          ls -la
          ls -la eden/CMakeModules/
          ls -la eden/CMakeModules/toolchains/ || true
