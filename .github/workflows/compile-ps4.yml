name: Check PS4 Build Files

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find ps4_link_mesa and toolchain files
        run: |
          echo "=== ONDE ESTA ps4_link_mesa ==="
          grep -rn "ps4_link_mesa" .
          echo "=== ARQUIVOS PS4 / CMAKE ==="
          find . -iname "*ps4*" -o -iname "*orbis*"
