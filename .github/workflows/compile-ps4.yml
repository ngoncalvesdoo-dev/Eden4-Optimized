name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install OpenOrbis PS4 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld curl jq tar unzip
          DOWNLOAD_URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name | endswith(".tar.gz") or endswith(".zip")) | .browser_download_url' | head -n 1)
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o toolchain_pkg
          sudo mkdir -p /opt/OpenOrbis
          if [[ "$DOWNLOAD_URL" == *.zip ]]; then
            sudo unzip -q toolchain_pkg -d /opt/OpenOrbis
          else
            sudo tar -xzf toolchain_pkg -C /opt/OpenOrbis
          fi
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis" >> $GITHUB_ENV

      - name: Compile project and build PKG
        run: |
          mkdir build && cd build
          cmake ..
          make

      - name: Upload generated PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Otimizado-PKG
          path: "**/*.pkg"
