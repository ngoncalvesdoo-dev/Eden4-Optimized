name: Build Valid PS4 FPKG (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-fpkg:
    runs-on: windows-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Download LibOrbisPkg (Windows) and Base PKG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path tools, base_pkg, extracted | Out-Null
          gh release download -R maxton/LibOrbisPkg -p "*.zip" -D tools
          $ZipFile = (Get-ChildItem -Path tools -Filter "*.zip" | Where-Object { $_.Name -notmatch "osx|linux|mac" } | Select-Object -First 1).FullName
          Expand-Archive -Path $ZipFile -DestinationPath tools\pkgtool -Force
          gh release download V1.1 -R ngoncalvesdoo-dev/Eden4-Optimized -p "*.pkg" -D base_pkg

      - name: Repack Valid Fake PKG with Custom Configs
        run: |
          $BasePkg = (Get-ChildItem -Path base_pkg -Filter "*.pkg" | Select-Object -First 1).FullName
          $Passcode = "00000000000000000000000000000000"

          $ExeTool = Get-ChildItem -Path tools\pkgtool -Filter "*PkgTool*.exe" -Recurse | Select-Object -First 1
          $DllTool = Get-ChildItem -Path tools\pkgtool -Filter "PkgTool.Core.dll" -Recurse | Select-Object -First 1

          function Run-PkgTool {
              param([string[]]$ToolArgs)
              if ($ExeTool) {
                  & $ExeTool.FullName @ToolArgs
              } elseif ($DllTool) {
                  dotnet $DllTool.FullName @ToolArgs
              } else {
                  Get-ChildItem -Path tools\pkgtool -Recurse
                  throw "PkgTool binary not found"
              }
          }

          # Extract clean PKG into valid GP4 project
          Run-PkgTool @("pkg_makegp4", "--passcode", $Passcode, "extracted", $BasePkg)

          # Create config folder with both ps4.ini and qt-config.ini inside extracted package
          New-Item -ItemType Directory -Force -Path "extracted\config" | Out-Null
          if (Test-Path "ps4.ini") {
              Copy-Item "ps4.ini" -Destination "extracted\ps4.ini" -Force
              Copy-Item "ps4.ini" -Destination "extracted\config\ps4.ini" -Force
              Copy-Item "ps4.ini" -Destination "extracted\config\qt-config.ini" -Force
          }

          # Register new files in the GP4 project so PS4 installs without CE-35659-8
          $Gp4File = (Get-ChildItem -Path extracted -Filter "*.gp4" -Recurse | Select-Object -First 1).FullName
          [xml]$gp4 = Get-Content $Gp4File
          $filesNode = $gp4.psproject.files
          Get-ChildItem -Path extracted -Recurse -File | Where-Object { $_.Extension -notin ".gp4", ".pkg" } | ForEach-Object {
              $relPath = $_.FullName.Substring((Resolve-Path "extracted").Path.Length + 1).Replace("\", "/")
              $exists = $filesNode.file | Where-Object { $_.targ_path -eq $relPath }
              if (-not $exists) {
                  $newFile = $gp4.CreateElement("file")
                  $newFile.SetAttribute("targ_path", $relPath)
                  $newFile.SetAttribute("orig_path", $relPath)
                  $filesNode.AppendChild($newFile) | Out-Null
              }
          }
          $gp4.Save($Gp4File)

          # Build valid PS4 FPKG
          Run-PkgTool @("pkg_build", $Gp4File, "Eden4-PS4-Valid-Optimized.pkg")

      - name: Upload Valid PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: Eden4-PS4-Valid-Optimized-PKG
          path: Eden4-PS4-Valid-Optimized.pkg
