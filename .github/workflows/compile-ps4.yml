name: Build Eden4 PS4 Slim & Base

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenOrbis PS4 Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld unzip tar pkg-config libudev-dev
          mkdir -p toolchain_dl
          gh release download v0.5.3 -R OpenOrbis/OpenOrbis-PS4-Toolchain -D toolchain_dl
          sudo mkdir -p /opt/OpenOrbis
          FILE=$(ls toolchain_dl/* | head -n 1)
          if [[ "$FILE" == *.zip ]]; then
            sudo unzip -q "$FILE" -d /opt/OpenOrbis
          else
            sudo tar -xzf "$FILE" -C /opt/OpenOrbis
          fi
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis" >> $GITHUB_ENV

      - name: Configure and Compile for PS4 Base/Slim
        run: |
          TOOLCHAIN_FILE=$(find /opt/OpenOrbis -iname "*toolchain*.cmake" | head -n 1)
          echo "Toolchain encontrado: $TOOLCHAIN_FILE"
          cd eden
          mkdir -p build && cd build
          cmake .. -G Ninja \
            ${TOOLCHAIN_FILE:+-DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"} \
            -DPS4=ON \
            -DYUZU_PS4=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=btver2 -mtune=btver2 -ffast-math" \
            -DCMAKE_CXX_FLAGS="-O3 -march=btver2 -mtune=btver2 -ffast-math" \
            -DYUZU_ENABLE_LTO=ON \
            -DENABLE_LIBUSB=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_RESHADE=OFF \
            -DENABLE_DEBUG_TOOLS=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DBUILD_TESTING=OFF
          ninja

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden4-PS4-Slim-Base-PKG
          path: "**/*.pkg"
