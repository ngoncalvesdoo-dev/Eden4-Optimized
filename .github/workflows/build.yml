name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openorbis/toolchain:latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Compile project and build PKG
        run: |
          mkdir -p build && cd build
          cmake ..
          make

      - name: Upload generated PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Otimizado-PKG
          path: "**/*.pkg"
