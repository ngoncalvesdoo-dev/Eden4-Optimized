name: Build Final Eden4 Optimized PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Download LibOrbisPkg and Base PKG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y unzip tar python3 libssl1.1
          mkdir -p tools base_pkg extracted
          
          # Download official LibOrbisPkg (PkgTool.Core) for Linux
          gh release download -R maxton/LibOrbisPkg -p "*linux*" -D tools || gh release download -R OpenOrbis/LibOrbisPkg -p "*linux*" -D tools
          FILE=$(ls tools/* | head -n 1)
          if [[ "$FILE" == *.zip ]]; then
            unzip -q "$FILE" -d tools/pkgtool
          else
            mkdir -p tools/pkgtool && tar -xzf "$FILE" -C tools/pkgtool
          fi
          
          # Download your base PKG from V1.1 release
          gh release download V1.1 -R ngoncalvesdoo-dev/Eden4-Optimized -p "*.pkg" -D base_pkg
          ls -la base_pkg/

      - name: Inject Custom Configs and Build Final PKG
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          PKGTOOL=$(find tools/pkgtool -iname "*PkgTool*" -type f | head -n 1)
          chmod +x "$PKGTOOL"

          PKG_IN=$(find base_pkg -name "*.pkg" | head -n 1)
          if [ -z "$PKG_IN" ]; then
            echo "No PKG file found in V1.1 release."
            exit 1
          fi

          # Extract PKG and generate GP4 project directly from original PKG
          "$PKGTOOL" pkg_makegp4 extracted/ "$PKG_IN"
          
          # Copy all custom configuration files (.ini) into extracted directory
          cp -fv *.ini extracted/ 2>/dev/null || true
          if [ -d "config" ]; then
            cp -rfv config/* extracted/ 2>/dev/null || true
          fi

          # Register custom .ini files inside the GP4 project so they are packed into the PKG
          GP4_FILE=$(find extracted -name "*.gp4" | head -n 1)
          python3 -c "
          import glob, os
          with open('$GP4_FILE', 'r', encoding='utf-8') as f:
              gp4 = f.read()
          extra_files = ''
          for ini in glob.glob('*.ini'):
              if ini not in gp4:
                  extra_files += f'    <file targ_path=\"{ini}\" orig_path=\"{ini}\"/>\n'
          if extra_files and '</files>' in gp4:
              gp4 = gp4.replace('</files>', extra_files + '  </files>')
              with open('$GP4_FILE', 'w', encoding='utf-8') as f:
                  f.write(gp4)
          "

          # Update application title in param.sfo for PS4 menu
          SFO_FILE=$(find extracted -iname "param.sfo" | head -n 1)
          if [ -n "$SFO_FILE" ]; then
            python3 -c "
          with open('$SFO_FILE', 'rb') as f:
              data = f.read()
          data = data.replace(b'Eden4', b'Eden4 Optimized').replace(b'yuzu', b'Eden4 Optimized')
          with open('$SFO_FILE', 'wb') as f:
              f.write(data)
          "
          fi

          # Build final modified PS4 PKG
          "$PKGTOOL" pkg_build "$GP4_FILE" Eden4-PS4-Slim-Base-Optimized.pkg

      - name: Upload Final Modified PKG
        uses: actions/upload-artifact@v4
        with:
          name: Eden4-PS4-Slim-Base-Optimized-PKG
          path: Eden4-PS4-Slim-Base-Optimized.pkg
