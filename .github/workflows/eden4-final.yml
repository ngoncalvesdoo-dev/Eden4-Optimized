name: Build Final Eden4 Optimized PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Download Base PKG from V1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base_pkg
          gh release download V1.1 -R ngoncalvesdoo-dev/Eden4-Optimized -p "*.pkg" -D base_pkg
          ls -la base_pkg/

      - name: Apply Optimizations and Update Name in PKG
        run: |
          python3 - << 'EOF'
          import glob, os, shutil

          pkg_files = glob.glob("base_pkg/*.pkg")
          if not pkg_files:
              raise FileNotFoundError("Base PKG not found")

          src_pkg = pkg_files[0]
          out_pkg = "Eden4-PS4-Slim-Base-Optimized.pkg"

          with open(src_pkg, "rb") as f:
              data = bytearray(f.read())

          # Update application title inside PKG metadata (keeping exact byte length)
          replacements = [
              (b"Eden4", b"Eden4"),
              (b"yuzu ", b"Eden4"),
              (b"Yuzu ", b"Eden4"),
          ]
          for old, new in replacements:
              data = data.replace(old, new)

          # Append custom INI configuration block with signature marker
          ini_payload = bytearray()
          for ini_file in sorted(glob.glob("*.ini")):
              with open(ini_file, "rb") as inf:
                  content = inf.read()
              ini_payload.extend(f"\n[EDEN4_OPT:{ini_file}]\n".encode("utf-8"))
              ini_payload.extend(content)

          with open(out_pkg, "wb") as outf:
              outf.write(data)
              if ini_payload:
                  outf.write(ini_payload)

          print(f"Successfully created {out_pkg} ({os.path.getsize(out_pkg)} bytes)")
          EOF

      - name: Upload Final Modified PKG
        uses: actions/upload-artifact@v4
        with:
          name: Eden4-PS4-Slim-Base-Optimized-PKG
          path: Eden4-PS4-Slim-Base-Optimized.pkg
