name: Build Final Eden4 Optimized PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Download LibOrbisPkg and Base PKG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y unzip tar python3
          mkdir -p tools base_pkg extracted
          
          # Download official LibOrbisPkg (PkgTool.Core) for Linux
          gh release download -R maxton/LibOrbisPkg -p "*linux*" -D tools || gh release download -R OpenOrbis/LibOrbisPkg -p "*linux*" -D tools
          FILE=$(ls tools/* | head -n 1)
          if [[ "$FILE" == *.zip ]]; then
            unzip -q "$FILE" -d tools/pkgtool
          else
            mkdir -p tools/pkgtool && tar -xzf "$FILE" -C tools/pkgtool
          fi
          
          # Download your base PKG from V1.1 release
          gh release download V1.1 -R ngoncalvesdoo-dev/Eden4-Optimized -p "*.pkg" -D base_pkg
          ls -la base_pkg/

      - name: Inject Custom Configs and Build Final PKG
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          PKGTOOL=$(find tools/pkgtool -iname "*PkgTool*" -type f | head -n 1)
          chmod +x "$PKGTOOL"

          PKG_IN=$(find base_pkg -name "*.pkg" | head -n 1)
          if [ -z "$PKG_IN" ]; then
            echo "No PKG file found in V1.1 release."
            exit 1
          fi

          # Extract original PKG (handles both direct files and Sc0/Image0 layout)
          "$PKGTOOL" pkg_extract "$PKG_IN" extracted/
          
          TARGET_DIR="extracted"
          if [ -d "extracted/Image0" ]; then
            TARGET_DIR="extracted/Image0"
          fi

          # Copy all custom configuration files (.ini) into the PKG
          cp -fv *.ini "$TARGET_DIR/" 2>/dev/null || true
          if [ -d "config" ]; then
            cp -rfv config/* "$TARGET_DIR/" 2>/dev/null || true
          fi

          # Update application title in param.sfo for PS4 menu
          SFO_FILE=$(find extracted -name "param.sfo" | head -n 1)
          python3 -c "
          with open('$SFO_FILE', 'rb') as f:
              data = f.read()
          data = data.replace(b'Eden4', b'Eden4 Optimized').replace(b'yuzu', b'Eden4 Optimized')
          with open('$SFO_FILE', 'wb') as f:
              f.write(data)
          "

          # Generate GP4 project and build final modified PS4 PKG
          "$PKGTOOL" pkg_makegp4 "$TARGET_DIR" project.gp4 || true
          if [ -f "project.gp4" ]; then
            "$PKGTOOL" pkg_build project.gp4 Eden4-PS4-Slim-Base-Optimized.pkg
          else
            "$PKGTOOL" pkg_build "$SFO_FILE" "$TARGET_DIR" Eden4-PS4-Slim-Base-Optimized.pkg
          fi

      - name: Upload Final Modified PKG
        uses: actions/upload-artifact@v4
        with:
          name: Eden4-PS4-Slim-Base-Optimized-PKG
          path: Eden4-PS4-Slim-Base-Optimized.pkg
