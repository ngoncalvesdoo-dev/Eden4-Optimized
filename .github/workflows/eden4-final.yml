jobs:
  build:
    name: Build Eden4 PS4 Base and Slim
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
timeout-minutes: 360

env:
  PS4_BUILD_ROOT: ${{ github.workspace }}/.ps4-build
  OPENORBIS: /opt/pacbrew/ps4/openorbis
  EDEN_PKG_SUFFIX: ${{ inputs.package_suffix || '-optimized' }}
  DEBIAN_FRONTEND: noninteractive

steps:
  - name: Checkout repository files
    uses: actions/checkout@v4

  - name: Install build dependencies
    shell: bash
    run: |
      apt-get update
      apt-get install -y --no-install-recommends \
        ca-certificates curl git patch xz-utils zstd \
        clang-21 lld-21 llvm-21 libclang-rt-21-dev \
        cmake ninja-build make nasm autoconf automake libtool \
        pkg-config python3 python3-pip python3-venv python3-pil \
        python3-mako python3-yaml meson glslang-tools \
        libdrm-dev libxml2-16

  - name: Install OpenOrbis toolchain
    shell: bash
    run: |
      python3 tools/pacbrew/fetch-pacbrew.py
      python3 tools/pacbrew/install-pacbrew.py
      test -f "$OPENORBIS/ps4vars.sh"

  - name: Build PS4 C++ runtime
    shell: bash
    run: |
      runtime/toolchain/build-libcxx.sh
      runtime/toolchain/build-runtime.sh

  - name: Prepare Mesa and libdrm
    shell: bash
    run: |
      mkdir -p "$PS4_BUILD_ROOT/src"
      cd "$PS4_BUILD_ROOT/src"

      curl -fL --retry 3 \
        https://archive.mesa3d.org/mesa-26.0.8.tar.xz \
        -o mesa-26.0.8.tar.xz

      tar -xf mesa-26.0.8.tar.xz
      mv mesa-26.0.8 mesa

      cd mesa
      patch -p1 < "$GITHUB_WORKSPACE/runtime/patches/mesa-ps4.patch"

      cp "$GITHUB_WORKSPACE/runtime/port/mesa/ac_ps4_drm.c" src/amd/common/

      cd "$PS4_BUILD_ROOT/src"
      git clone --depth 1 --branch libdrm-2.4.125 \
        https://gitlab.freedesktop.org/mesa/drm.git libdrm

  - name: Prepare Mesa Python environment
    shell: bash
    run: |
      python3 -m venv "$PS4_BUILD_ROOT/mesa-venv"
      "$PS4_BUILD_ROOT/mesa-venv/bin/pip" install --upgrade pip
      "$PS4_BUILD_ROOT/mesa-venv/bin/pip" install meson mako pyyaml

  - name: Build Mesa RADV
    shell: bash
    run: |
      runtime/scripts/build-mesa.sh setup

  - name: Build and package Eden4
    shell: bash
    run: |
      eden/ps4/build.sh

  - name: Verify generated PKG
    shell: bash
    run: |
      set -e
      ls -lh .ps4-build/out/*.pkg
      test -s "$(find .ps4-build/out -name '*.pkg' -print -quit)"
      echo "PKG build artifact found."

  - name: Upload Final Modified PKG
    uses: actions/upload-artifact@v4
    with:
      name: Eden4-Performance-PS4-Base-Slim-PKG
      path: .ps4-build/out/*.pkg
      if-no-files-found: error
      retention-days: 14
