name: Build Eden4 PS4 Slim & Base

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenOrbis PS4 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld curl jq tar unzip pkg-config
          DOWNLOAD_URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name | endswith(".tar.gz") or endswith(".zip")) | .browser_download_url' | head -n 1)
          curl -L "$DOWNLOAD_URL" -o toolchain_pkg
          sudo mkdir -p /opt/OpenOrbis
          if [[ "$DOWNLOAD_URL" == *.zip ]]; then
            sudo unzip -q toolchain_pkg -d /opt/OpenOrbis
          else
            sudo tar -xzf toolchain_pkg -C /opt/OpenOrbis
          fi
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis" >> $GITHUB_ENV

      - name: Configure and Compile for PS4 Base/Slim
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DPS4=ON \
            -DYUZU_PS4=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=btver2 -mtune=btver2 -ffast-math" \
            -DCMAKE_CXX_FLAGS="-O3 -march=btver2 -mtune=btver2 -ffast-math" \
            -DYUZU_ENABLE_LTO=ON \
            -DENABLE_QT=OFF \
            -DENABLE_RESHADE=OFF \
            -DENABLE_DEBUG_TOOLS=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DBUILD_TESTING=OFF
          ninja

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden4-PS4-Slim-Base-PKG
          path: "**/*.pkg"
