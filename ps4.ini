[System]
docked=0
output=720
ui_theme=black
ui_sounds=on
profile=off
user=0
IgnoreMissingServices=true

[Controls]
player1_type=pro
player2_type=pro
player3_type=pro
player4_type=pro

[Graphics]
renderer=vulkan
UseVSync=false
UseAsynchronousShaderCompilation=true
AnisotropicFiltering=0
ResolutionScale=0.40
LimitSpeedPercent=60
ShadowsQuality=0
Reflections=false
MotionBlur=false
Bloom=false
AmbientOcclusion=false
AntiAliasing=0
ForceHighPerformanceGPU=true

[Memory]
inline_memory=1
direct_table=1
page_reuse=1
regalloc=on
UnsafeMemoryOptimizations=true
DisableGarbageCollection=false

[Shaders]
EnablePipelineCache=true
UseDiskShaderCache=true
EnableShaderShards=true
PrecompileShards=true
ShaderCacheSize=2048
